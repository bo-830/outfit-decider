/* 并排与单张之间、视口与筛选变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */
::view-transition-group(*){animation-duration:var(--glide-d);animation-timing-function:var(--glide)}
::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口、筛选、说明开关和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

const DATA = {"schemaVersion": 1, "project": "出门穿什么 outfit-decider（移动端穿搭决策 App）", "brief": "同一份内容、同一个主动作的两个视觉方向：上传页（1–4 张穿搭照 + 场合/天气/风格三组可横滑 chips + 一条问题 + 底部「开始快速评分」）、结果页（按综合分降序的 4 套读数，六维分数，深度分析入口，弱网横幅）、双系统同屏对比（左「快速评分」分数 / 右「深度分析」报告）。目标设备 390×844 手机。", "round": "01", "candidates": [{"id": "a-morning-fitting-room", "name": "A · 晨光试衣间", "concept": "像早上 8 点在试衣间里试完四条搭配、把照片摊在亚麻桌布上挑一套：纸与布的手感，安静、可信、不喧闹。分数是裁缝软尺上的读数。", "typography": "中文系统字（PingFang / 微软雅黑）中字重；层级只靠字号对比 26/30/15/13/11px；分数与数字用 tabular 加粗（30–34px）与正文 13px 拉开 2.3 倍", "palette": ["#F6F1E8", "#FFFCF7", "#231E17", "#C4761C", "#E3D9C9"], "traits": ["未漂白亚麻纸底 + 墨黑字 + 单一琥珀强调", "首屏没有标题栏与 Logo，第一排就是 2×2 照片网格", "chips 选中＝墨色实心 pill，琥珀只留给底部主 CTA", "结果页是纸卡流：排名第 1 的卡片抬高一档并带「今天穿这套」角标", "六维分数用小标签 + 细轨条，密度中等偏疏"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>方向 A · 晨光试衣间\u003c/title>\n\u003cstyle>\n*,*::before,*::after{box-sizing:border-box}\n:root{\n  --desk:#24242A;\n  --bg:#F6F1E8;\n  --surface:#FFFCF7;\n  --surface-2:#EFE7DA;\n  --line:#E3D9C9;\n  --line-strong:#D3C6B0;\n  --ink:#231E17;\n  --ink-2:#6B6154;\n  --ink-3:#A79C8C;\n  --amber:#C4761C;\n  --amber-soft:#F6E7CF;\n  --green:#5E7A4B;\n  --danger:#B4553A;\n  --sans:\"PingFang SC\",\"Microsoft YaHei\",\"Noto Sans SC\",system-ui,-apple-system,sans-serif;\n  --r-lg:20px; --r-md:14px; --r-sm:10px; --r-pill:999px;\n  --paper:0 1px 2px rgba(75,58,35,.07), 0 14px 26px -20px rgba(75,58,35,.6);\n  --paper-lift:0 2px 4px rgba(75,58,35,.10), 0 22px 34px -22px rgba(75,58,35,.7);\n}\nbody{margin:0;background:var(--desk);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}\n.app{width:390px;margin:0 auto;display:flex;flex-direction:column;gap:26px;padding:26px 0}\n.screen{background:var(--bg);min-height:844px;display:flex;flex-direction:column;position:relative}\n.screen.clip{height:844px;min-height:0;overflow:hidden}\n.pad{padding-left:16px;padding-right:16px}\n.num{font-variant-numeric:tabular-nums}\n\n/* 状态栏与 Tab */\n.status{display:flex;justify-content:space-between;align-items:center;padding:13px 20px 4px;font-size:12px;color:var(--ink-2)}\n.status-l{font-variant-numeric:tabular-nums;letter-spacing:.02em}\n.status-r{display:flex;gap:5px;align-items:center;opacity:.6}\n.status-r i{display:block;width:13px;height:8px;border:1.2px solid currentColor;border-radius:2px}\n.status-r i:last-child{width:20px;background:linear-gradient(90deg,currentColor 62%,transparent 62%)}\n.tabs{display:flex;gap:22px;overflow-x:auto;padding:8px 20px 0;margin-bottom:2px}\n.tabs::-webkit-scrollbar{display:none}\n.tab{font-size:15px;color:var(--ink-3);padding:6px 0 10px;border-bottom:2px solid transparent;white-space:nowrap}\n.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}\n\n/* 标题区 */\n.head{padding-top:14px;padding-bottom:14px}\n.head h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.02em}\n.head p{margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}\n.head p b{font-weight:600;color:var(--ink)}\n\n/* 照片网格 */\n.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.shot{position:relative;margin:0;border-radius:var(--r-md);overflow:hidden;background:var(--surface-2);border:1px solid var(--line);box-shadow:var(--paper);aspect-ratio:4/5}\n.shot img{display:block;width:100%;height:100%;object-fit:cover}\n.shot .no{position:absolute;left:8px;bottom:8px;background:rgba(35,30,23,.72);color:#FFF8EC;font-size:11px;padding:3px 8px;border-radius:var(--r-pill);letter-spacing:.06em}\n.shot .del{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,252,247,.92);color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}\n.grid-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;color:var(--ink-2)}\n.grid-foot b{font-weight:600;color:var(--ink)}\n.link{color:var(--amber);font-weight:600}\n\n/* 区块标签与 chips */\n.block{margin-top:20px}\n.label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}\n.label b{font-size:15px;font-weight:600}\n.label span{font-size:11.5px;color:var(--ink-3)}\n.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px}\n.chips::-webkit-scrollbar{display:none}\n.chip{flex:0 0 auto;height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);font-size:14px;white-space:nowrap}\n.chip.on{background:var(--ink);border-color:var(--ink);color:#FFF8EC;font-weight:500}\n.chip.sm{height:40px;font-size:13.5px}\n\n/* 输入 */\n.input{margin-top:2px;min-height:52px;display:flex;align-items:center;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);font-size:14px;line-height:1.5}\n.input.ph{color:var(--ink-3)}\n.hint{display:flex;gap:8px;align-items:flex-start;margin-top:16px;padding:11px 13px;border-radius:var(--r-sm);background:var(--amber-soft);color:#7A4A0E;font-size:12.5px;line-height:1.5}\n.hint i{flex:0 0 auto;width:15px;height:15px;border-radius:50%;background:var(--amber);color:#FFF8EC;font-size:10px;font-style:normal;display:flex;align-items:center;justify-content:center;margin-top:2px}\n\n/* 底部主 CTA */\n.dock{margin-top:auto;position:sticky;bottom:0;background:linear-gradient(180deg,rgba(246,241,232,0) 0%,var(--bg) 26%);padding:18px 16px 22px}\n.cta{width:100%;height:56px;border:0;border-radius:var(--r-pill);background:var(--amber);color:#FFF9F0;font-family:inherit;font-size:17px;font-weight:600;letter-spacing:.02em;box-shadow:0 10px 20px -12px rgba(196,118,28,.9)}\n.cta-sub{margin-top:9px;text-align:center;font-size:11.5px;color:var(--ink-3)}\n\n/* 弱网横幅 */\n.banner{display:flex;gap:10px;align-items:flex-start;margin:2px 16px 0;padding:12px 13px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--paper)}\n.banner .bd{flex:1;font-size:12.5px;line-height:1.55;color:var(--ink-2)}\n.banner .bd b{display:block;font-size:13px;color:var(--ink);font-weight:600;margin-bottom:2px}\n.banner .act{flex:0 0 auto;align-self:center;font-size:12.5px;font-weight:600;color:var(--amber);white-space:nowrap}\n\n/* 排名卡片 */\n.card{display:flex;gap:12px;padding:12px;margin:0 16px 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);box-shadow:var(--paper)}\n.card.top{border-color:var(--line-strong);box-shadow:var(--paper-lift)}\n.card .rk{flex:0 0 auto;width:26px;text-align:center}\n.card .rk b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-3);line-height:1.1}\n.card.top .rk b{color:var(--amber)}\n.card .thumb{flex:0 0 auto;width:62px;height:78px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}\n.card .thumb img{display:block;width:100%;height:100%;object-fit:cover}\n.card .body{flex:1;min-width:0}\n.card .top-line{display:flex;align-items:baseline;justify-content:space-between;gap:8px}\n.card .tag{font-size:10.5px;padding:2px 7px;border-radius:var(--r-pill);background:var(--amber-soft);color:#7A4A0E;font-weight:600;transform:rotate(-1.5deg)}\n.card .sc{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}\n.card .sc small{font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-left:3px}\n.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px;margin-top:11px}\n.dim .dl{font-size:10.5px;color:var(--ink-3);display:block}\n.dim .dv{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;display:block;margin-top:1px;color:var(--ink-2)}\n.dim.hot .dv,.dim.hot .dl{color:var(--ink)}\n/* 软尺：每一维是一条 0–5 的刻度尺，读数落在指针上 */\n.dim .tr{position:relative;display:block;height:12px;margin-top:5px;border-bottom:1px solid var(--line-strong);\n  background-image:repeating-linear-gradient(90deg,var(--line-strong) 0 1px,transparent 1px 100%);\n  background-size:20% 6px;background-repeat:repeat-x;background-position:left bottom}\n.dim .tr u{display:block;height:100%;background:none;position:relative}\n.dim .tr u::after{content:\"\";position:absolute;right:-1px;bottom:0;width:2px;height:11px;background:var(--ink-2)}\n.dim.hot .tr u::after{background:var(--amber);height:14px}\n.card .deep{margin-top:11px;height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink)}\n.card .deep.ghost{color:var(--ink-2);border-style:dashed}\n\n/* 对比开关 */\n.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 16px 0;padding:14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}\n.switch-row .sl b{display:block;font-size:14px;font-weight:600}\n.switch-row .sl span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}\n.sw{flex:0 0 auto;width:50px;height:30px;border-radius:var(--r-pill);background:var(--ink);position:relative}\n.sw i{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:var(--surface)}\n.sw.off{background:var(--line-strong)}\n.sw.off i{right:auto;left:3px}\n\n/* 双系统同屏对比 */\n.cmp-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px}\n.cmp-head b{font-size:17px;font-weight:600}\n.cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 16px;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface);box-shadow:var(--paper)}\n.pane{padding:12px 12px 14px;min-width:0}\n.pane+.pane{border-left:1px solid var(--line);background:var(--surface-2)}\n.ptag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:var(--r-pill);background:var(--ink);color:#FFF8EC}\n.pane.two .ptag{background:var(--amber)}\n.pane .big{margin-top:10px;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}\n.pane .big small{display:block;font-size:11px;font-weight:500;color:var(--ink-3);margin-top:5px;letter-spacing:0}\n.plist{margin-top:12px;display:flex;flex-direction:column;gap:9px}\n.prow{display:flex;align-items:center;gap:8px}\n.prow .pl{flex:1;font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.prow .pv{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}\n.prow .pv.hot{color:var(--amber)}\n.stars{color:var(--amber);font-size:12px;letter-spacing:1px}\n.rankline{display:flex;gap:8px;align-items:center;padding-bottom:9px;border-bottom:1px dashed var(--line-strong)}\n.rankline:last-child{border-bottom:0;padding-bottom:0}\n.rankline .rt{flex:0 0 auto;width:30px;height:38px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}\n.rankline .rt img{display:block;width:100%;height:100%;object-fit:cover}\n.rankline .rb{flex:1;min-width:0}\n.rankline .rb b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.rankline .rb span{display:block;font-size:10.5px;color:var(--ink-3);line-height:1.45;margin-top:2px}\n.note{margin-top:12px;padding:10px;border-radius:var(--r-sm);background:var(--amber-soft)}\n.note b{display:block;font-size:11.5px;font-weight:600;color:#7A4A0E}\n.note p{margin:4px 0 0;font-size:11px;line-height:1.55;color:#7A4A0E}\n.pane .caption{margin-top:12px;font-size:11px;color:var(--ink-3);line-height:1.5}\n.footnote{padding:14px 16p AAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSwAAAHvZf87b/+SX5gC2gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//2Q==\" alt=\"\">\u003c/span>\u003cspan class=\"rb\">\u003cb>第 3 套 · \u003cspan class=\"stars\">★★★★\u003c/span>\u003c/b>\u003cspan>舒服好走，但偏日常\u003c/span>\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"note\">\u003cb>选第 1 套\u003c/b>\u003cp>上半身干净利落，见客户不掉分；晚上吃饭也不显得用力过猛。\u003c/p>\u003c/div>\n        \u003cdiv class=\"caption\">鞋子偏休闲，换成皮质乐福鞋会更稳。\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"footnote\">左栏是六维分数，右栏是带着理由的报告；两边评的是同一套照片。\u003c/div>\n  \u003c/section>\n\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "style-a.html", "baseline": false, "interactive": false}, {"id": "b-cold-decision-desk", "name": "B · 冷光决策台", "concept": "把双系统做成一台认真测过的仪器：System One 是六个维度的读数灯，System Two 是带理由的报告。仪式感来自「被一台仪器测过」，而不是可爱。", "typography": "数字与拉丁标签用等宽（ui-monospace），中文用系统黑体；编号与标签大写宽字距 9.5–11px；分数等宽 27–32px", "palette": ["#0F1216", "#171B21", "#E9EEF4", "#4FE3C1", "#F2B33D"], "traits": ["石墨黑面板 + 冷青读数灯，全 App 无白底页面", "照片是仪器插槽：LOOK 01 铭牌 + 就绪指示灯 + 方角描边", "chips 是拨档开关：方角、左侧亮灯带，44px 触达", "分数画成看得见的量：每维 5 格刻度，末格按小数部分点亮", "结果排序是读数表行（01/02/03/04 等宽大字 + 细分隔线），不是圆角卡片"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>方向 B · 冷光决策台\u003c/title>\n\u003cstyle>\n*,*::before,*::after{box-sizing:border-box}\n:root{\n  --desk:#0A0C0F;\n  --bg:#0F1216;\n  --panel:#171B21;\n  --panel-2:#1E232B;\n  --line:#262D35;\n  --line-2:#3B444E;\n  --ink:#E9EEF4;\n  --ink-2:#98A3AF;\n  --ink-3:#68727D;\n  --cyan:#4FE3C1;\n  --cyan-dim:#1F5C4F;\n  --amber:#F2B33D;\n  --danger:#FF6B5A;\n  --sans:\"PingFang SC\",\"Microsoft YaHei\",\"Noto Sans SC\",system-ui,-apple-system,sans-serif;\n  --mono:ui-monospace,\"SFMono-Regular\",Menlo,Consolas,\"Liberation Mono\",monospace;\n  --r-lg:8px; --r-md:6px; --r-sm:4px;\n}\nbody{margin:0;background:var(--desk);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}\n.app{width:390px;margin:0 auto;display:flex;flex-direction:column;gap:26px;padding:26px 0}\n.screen{background:var(--bg);min-height:844px;display:flex;flex-direction:column;position:relative}\n.screen.clip{height:844px;min-height:0;overflow:hidden}\n.pad{padding-left:16px;padding-right:16px}\n.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:\"tnum\" 1}\n.mono{font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}\n\n/* 状态栏 + 铭牌头 */\n.status{display:flex;justify-content:space-between;align-items:center;padding:13px 20px 4px;font-size:12px;color:var(--ink-3)}\n.status-r{display:flex;gap:5px;align-items:center}\n.status-r i{display:block;width:13px;height:8px;border:1.2px solid currentColor;border-radius:1px}\n.status-r i:last-child{width:20px;background:linear-gradient(90deg,currentColor 62%,transparent 62%)}\n.plate-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 9px;border-bottom:1px solid var(--line);font-size:9.5px;color:var(--ink-3)}\n.plate-bar b{color:var(--ink-2);font-weight:500}\n.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0}\n.tabs::-webkit-scrollbar{display:none}\n.tab{flex:0 0 auto;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);padding:9px 11px;border:1px solid transparent;border-radius:var(--r-sm);white-space:nowrap}\n.tab.on{color:var(--cyan);border-color:var(--line-2);background:var(--panel)}\n.tab i{font-style:normal;color:var(--ink-3);margin-right:6px}\n\n/* 标题 */\n.head{padding-top:18px;padding-bottom:16px}\n.head h1{margin:0;font-size:23px;font-weight:600;letter-spacing:.01em}\n.head .meta{margin-top:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-3)}\n.head .meta b{color:var(--cyan);font-weight:500}\n\n/* 照片插槽 */\n.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.slot{position:relative;margin:0;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-md);overflow:hidden;aspect-ratio:4/5}\n.slot img{display:block;width:100%;height:100%;object-fit:cover;opacity:.94}\n.slot .plate{position:absolute;left:6px;top:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;background:rgba(10,12,15,.78);color:var(--cyan);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:3px 6px}\n.slot .kill{position:absolute;right:6px;top:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink);background:rgba(10,12,15,.78);border:1px solid var(--line-2);border-radius:var(--r-sm)}\n.slot .ready{position:absolute;left:6px;bottom:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-2);display:flex;align-items:center;gap:5px}\n.slot .ready em{width:6px;height:6px;background:var(--cyan);display:block;border-radius:50%}\n.grid-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--ink-2)}\n.grid-foot .link{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--cyan)}\n\n/* 区块 + 拨档 chips */\n.block{margin-top:20px}\n.label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:7px}\n.label b{font-size:13px;font-weight:600;letter-spacing:.02em}\n.label b em{font-family:var(--mono);font-style:normal;font-size:9.5px;color:var(--ink-3);letter-spacing:.1em;margin-right:7px}\n.label span{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-3)}\n.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px}\n.chips::-webkit-scrollbar{display:none}\n.chip{flex:0 0 auto;height:44px;display:inline-flex;align-items:center;padding:0 14px;gap:8px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--panel);color:var(--ink-2);font-size:13.5px;white-space:nowrap}\n.chip em{width:5px;height:5px;border-radius:50%;background:var(--line-2);display:block}\n.chip.on{color:var(--ink);border-color:var(--cyan-dim);background:linear-gradient(90deg,rgba(79,227,193,.14),rgba(79,227,193,.03))}\n.chip.on em{background:var(--cyan)}\n.chip.sm{height:42px;font-size:13px}\n\n/* 输入 */\n.input{margin-top:2px;min-height:52px;display:flex;align-items:center;gap:9px;padding:12px 13px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--panel);font-size:13.5px;line-height:1.5}\n.input .cur{width:2px;height:15px;background:var(--cyan);display:block;flex:0 0 auto}\n.input.ph{color:var(--ink-3)}\n.hint{display:flex;gap:9px;align-items:flex-start;margin:18px 16px 0;padding:11px 12px;border-left:2px solid var(--amber);background:var(--panel);font-size:12px;line-height:1.55;color:var(--ink-2)}\n.hint b{color:var(--ink);font-weight:600}\n\n/* 底部命令条 */\n.dock{margin-top:auto;position:sticky;bottom:0;background:linear-gradient(180deg,rgba(15,18,22,0) 0%,var(--bg) 30%);padding:18px 16px 22px}\n.cta{width:100%;height:56px;border:0;border-radius:var(--r-md);background:var(--cyan);color:#04241D;font-family:var(--sans);font-size:16px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:10px}\n.cta em{font-family:var(--mono);font-style:normal;font-size:15px}\n.cta-sub{margin-top:9px;text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-3)}\n\n/* 弱网横幅 */\n.banner{display:flex;gap:10px;align-items:center;margin:0 16px;padding:12px;border:1px solid var(--line-2);border-left:2px solid var(--amber);background:var(--panel)}\n.banner .bd{flex:1;font-size:12px;line-height:1.55;color:var(--ink-2)}\n.banner .bd  function syncService(s,c){

 async function checkService(url){
  const state=services.get(url);if(state.pending)return;state.pending=true;

  const m=document.createElement(c.kind==='image'?'img':'iframe');
  if(c.kind==='image'){m.alt=c.name;m.draggable=false;}
  else{m.title=c.name;m.setAttribute('sandbox',c.kind==='url'?'allow-scripts allow-same-origin allow-forms':c.interactive?'allow-scripts allow-forms':'');m.referrerPolicy='no-referrer';if(!interactive)m.tabIndex=-1;}
  m.addEventListener('load',()=>{if(c.kind==='url'&&services.get(c.content).ready!==true)return;s.classList.add('ready');fit(s);});
  if(c.kind==='image')m.src=c.content;else if(c.kind!=='url')m.srcdoc=c.content;
  s.append(m);
  if(c.kind==='url'){s.append(serviceNotice());syncService(s,c);}
  if(c.kind!=='html'||c.interactive)s.append(el('span','static',c.kind==='url'?'本地运行':c.kind==='image'?'静态图':'可操作'));
  return s;
 }
 function fit(s){
  if(!s.isConnected)return;
  const size=SIZES[st.viewport],m=s.querySelector('iframe,img'),box=s.parentElement;let r;
  if(box.classList.contains('slide')){const cs=getComputedStyle(box),w=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),h=narrow()?Infinity:box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);r=box.dataset.zoom==='actual'?1:Math.min(w/size.w,h/size.h,1);}
  else r=Math.min(box.clientWidth/size.w,1);
  if(!(r>0))return;
  s.style.width=`${size.w*r}px`;s.style.height=`${size.h*r}px`;m.style.width=`${size.w}px`;m.style.height=`${size.h}px`;m.style.transform=`scale(${r})`;
 }
 const fitAll=()=>$$('.stage').forEach(fit),refit=()=>requestAnimationFrame(fitAll);

 function specList(c){
  const dl=el('dl','spec');const row=(k,v)=>{dl.append(el('dt',null,k),el('dd',null,v));};
  row('字体',c.typography);row('特征',(c.traits||[]).join(' · '));return dl;
 }
 function pickButton(c){const b=el('button','pick');b.type='button';b.dataset.pick=c.id;b.addEventListener('click',()=>choose(c.id));return b;}
 function card(c,i){
  const a=el('article','card');a.dataset.id=c.id;a.style.setProperty('--i',i);a.setAttribute('aria-label',c.name);
  const frame=el('div','frame');frame.style.viewTransitionName=vtName(c);const s=stage(c,false);
  const hit=el('button','hit');hit.type='button';hit.setAttribute('aria-label',`单张查看 ${c.name}`);hit.addEventListener('click',()=>setLayout('loupe',c.id));
  s.append(hit);frame.append(s,el('span','pick-mark','已选择'),el('span','peek','点击单张查看 · 实际尺寸'));
  const cap=el('div','cap');cap.style.viewTransitionName=`cap-${C.indexOf(c)}`;cap.append(el('span',c.baseline?'no base':'no',no(c)),el('h2','name',c.name),stripMini(c),pickButton(c));
  const lede=el('p','lede',c.concept);lede.title=c.concept;lede.style.viewTransitionName=`lede-${C.indexOf(c)}`;
  a.append(frame,cap,lede);return a;
 }
 function syncCompare(){
  const list=shown(),g=$('#grid'),key=list.map(c=>c.id).join();
  if(key!==gridKey){gridKey=key;g.replaceChildren(...list.map(card));}
  g.dataset.notes=st.notesOn?'on':'off';g.style.setProperty('--cols',Math.min(Math.max(list.length,1),st.viewport==='mobile'?4:3));
  $$('.card .frame').forEach(f=>f.dataset.viewport=st.viewport);
 }

 // 单张查看：所有方向预先排成一条横向轨道，切换时整条轨道滑动，不重新加载画面
 function syncLoupe(dir){
  const list=shown(),key=list.map(c=>c.id).join();if(!list.length)return;
  if(key!==loupeKey){
   loupeKey=key;dir=0;
   $('#track').replaceChildren(...list.map(c=>{const sl=el('div','slide');sl.dataset.id=c.id;sl.append(stage(c,true));return sl;}));
   $('#film').replaceChildren(el('span','film-ind'),...list.map(c=>{const b=el('button');b.type='button';b.dataset.id=c.id;b.append(el('span','fn',no(c)),el('span','ft',c.name),stripMini(c));b.addEventListener('click',()=>go(c.id));return b;}));
  }
  if(!list.some(c=>c.id===st.current))st.current=list[0].id;
  const i=list.findIndex(c=>c.id===st.current),track=$('#track');
  if(!dir)track.style.transition='none';
  track.style.transform=`translateX(${-i*100}%)`;
  if(!dir){track.offsetWidth;track.style.transition='';}
  $$('.slide').forEach(sl=>{const on=sl.dataset.id===st.current;sl.classList.toggle('is-current',on);sl.inert=!on;sl.dataset.zoom=on&&zoomActual?'actual':'fit';sl.firstElementChild.style.viewTransitionName=on?vtName(byId[sl.dataset.id]):'none';});
  $('#prev').disabled=i<=0;$('#next').disabled=i>=list.length-1;
  $$('#film button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===st.current)));
  renderInfo(dir);placeFilm(!dir);
  const cur=$('#film [aria-current=true]'),f=$('#film');
  if(cur&&f.scrollWidth>f.clientWidth)f.scrollTo({left:cur.offsetLeft-16,behavior:calm.matches||!dir?'auto':'smooth'});
 }
 function renderInfo(dir){
  const c=byId[st.current],body=$('#info-body');
  const sw=el('div','big-sw');(c.palette||[]).forEach(h=>{const d=el('div');const x=el('i');x.style.background=h;d.append(x,h.toUpperCase());sw.append(d);});
  const tools=el('div','tools');const z=el('button','tool',zoomActual?'适应窗口':'实际尺寸 100%');z.id='zoom';z.type='button';z.setAttribute('aria-pressed',String(zoomActual));z.addEventListener('click',toggleZoom);tools.append(z);
  const hint=el('p','hint');hint.innerHTML='<kbd>←</kbd> <kbd>→</kbd> 切换方向　<kbd>P</kbd> 选择并复制<br><kbd>Esc</kbd> 回到并排';
  const blocks=[el('span','idx',no(c)),el('h2','name',c.name)];
  if(st.notesOn)blocks.push(el('p','north',c.concept),sw,specList(c));
  blocks.push(pickButton(c),tools,hint,el('p','src',c.kind==='image'?`静态图：${c.sourceLabel}。缩放不代表响应式重排。`:c.kind==='url'?`实时运行 ${c.sourceLabel}。空白时确认开发服务器已启动，且允许被嵌入。`:c.interactive?`单张查看时可以直接操作 ${c.sourceLabel}；无法联网，也不保留浏览器存储。`:`预览禁用脚本与提交；交互请直接打开 ${c.sourceLabel}。`));
  body.replaceChildren(...blocks);paintChoice();
  if(dir)animate(body,[{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:420,easing:ease('glide')});
 }
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?'适应窗口':'实际尺寸 100%';z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;$('#none').hidden=list.length>0;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  $('#notes-toggle').checked=st.notesOn;
  $('#filter-summary').textContent=`比较范围 ${list.length}/${C.length}`;
  $$('#filter-list input').forEach(i=>i.checked=st.visible.includes(i.value));
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”会带上最新备注重新复制，不再有单独的复制按钮
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
   animate($('#decide-name'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:380,easing:ease('glide')});
   animate($('#choice-chip'),[{transform:'scale(.3)'},{transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?'已选择':'已选择 · 复制'):(short?'选择':'选这个方向')));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?'再点一次，带上最新备注重新复制':'选择这个方向，并复制给 Agent';});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
  const c=byId[st.chosen];$('#decide-name').textContent=c?`${no(c)} ${c.name}`:'未选择方向';$('#picked').classList.toggle('on',!!c);
  const chip=$('#choice-chip'),next=c?stripMini(c):el('span','choice-empty');next.id='choice-chip';chip.replaceWith(next);
  status();
 }
 function status(){$('#notes-open').textContent=st.notes?'备注 ·':'备注';const s=$('#state');if(!stored){s.textContent='浏览器存储不可用：关闭页面后选择和备注不会保留。';s.dataset.warn='';}else{s.textContent='备注会和选择一起复制。改完备注，再点一次“已选择”重新复制。';delete s.dataset.warn;}}
 function copyText(){const c=byId[st.chosen];let t=`${DATA.round?DATA.round+'：':''}选 ${no(c)} ${c.name}`;if(st.notes.trim())t+=`\n备注：${st.notes.trim()}`;return t;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,t){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?'已复制，粘贴给 Agent':'复制失败，请手动复制';n.querySelector('code').textContent=ok?t.replace(/\n/g,' · '):t;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 const fl=$('#filter-list');
 C.forEach(c=>{const l=el('label'),i=el('input');i.type='checkbox';i.value=c.id;i.addEventListener('change',()=>{st.visible=C.map(x=>x.id).filter(id=>id===c.id?i.checked:st.visible.includes(id));save();morph(render,'reshape');});l.append(i,el('span','n',no(c)),c.name);fl.append(l);});
 $('#show-all').addEventListener('click',()=>{st.visible=C.map(c=>c.id);save();morph(render,'reshape');});
 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 $('#notes-toggle').addEventListener('change',e=>{st.notesOn=e.target.checked;save();morph(render,'reshape');});
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 const notes=$('#notes');notes.value=st.notes||'';
 notes.addEventListener('input',()=>{st.notes=notes.value;save();status();});
 $('#notes-open').parentElement.addEventListener('toggle',e=>{if(e.target.open)notes.focus();});
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
